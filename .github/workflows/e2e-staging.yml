name: E2E Staging

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module test suite to run
        required: true
        default: stock
        type: choice
        options:
          - stock
          - stock-operations
      mode:
        description: Execution mode
        required: true
        default: safe
        type: choice
        options:
          - safe
          - full
          - run
      op_seller_name:
        description: Seller name for stock-operations (optional)
        required: false
        default: ""
        type: string
      op_create_products:
        description: Create products before running operations
        required: false
        default: false
        type: boolean
      op_product_count:
        description: Number of products to create when create_products is true
        required: false
        default: "1"
        type: string
      op_ingress_count:
        description: Number of ingress operations to execute
        required: false
        default: "1"
        type: string
      op_egress_count:
        description: Number of egress operations to execute
        required: false
        default: "0"
        type: string
      op_min_amount:
        description: Minimum random amount per operation
        required: false
        default: "1"
        type: string
      op_max_amount:
        description: Maximum random amount per operation
        required: false
        default: "5"
        type: string
      op_start_step:
        description: Functional step to start from after login
        required: false
        default: login
        type: choice
        options:
          - login
          - select-seller
          - create-products
          - ingress
          - egress
          - verify

jobs:
  e2e-staging:
    name: E2E ${{ github.event.inputs.module }} (${{ github.event.inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PW_ADMIN_EMAIL: ${{ secrets.PW_ADMIN_EMAIL }}
      PW_ADMIN_PASSWORD: ${{ secrets.PW_ADMIN_PASSWORD }}
      PW_BRANCH_NAME: ${{ secrets.PW_BRANCH_NAME }}
      PLAYWRIGHT_BASE_URL: ${{ secrets.PLAYWRIGHT_BASE_URL }}
    steps:
      - name: Enforce staging branch
        if: github.ref_name != 'staging'
        run: |
          echo "This workflow must be run from the staging branch."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve command
        id: resolve
        shell: bash
        run: |
          case "${{ github.event.inputs.module }}:${{ github.event.inputs.mode }}" in
            stock:safe)
              echo "command=npm run test:e2e:stock:safe" >> "$GITHUB_OUTPUT"
              ;;
            stock:full)
              echo "command=npm run test:e2e:stock:full" >> "$GITHUB_OUTPUT"
              ;;
            stock-operations:run)
              echo "command=npm run test:e2e:stock:operations" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported combination: ${{ github.event.inputs.module }} / ${{ github.event.inputs.mode }}"
              exit 1
              ;;
          esac

      - name: Export stock-operations inputs
        if: github.event.inputs.module == 'stock-operations'
        shell: bash
        run: |
          echo "PW_OP_SELLER_NAME=${{ github.event.inputs.op_seller_name }}" >> "$GITHUB_ENV"
          echo "PW_OP_CREATE_PRODUCTS=${{ github.event.inputs.op_create_products }}" >> "$GITHUB_ENV"
          echo "PW_OP_PRODUCT_COUNT=${{ github.event.inputs.op_product_count }}" >> "$GITHUB_ENV"
          echo "PW_OP_INGRESS_COUNT=${{ github.event.inputs.op_ingress_count }}" >> "$GITHUB_ENV"
          echo "PW_OP_EGRESS_COUNT=${{ github.event.inputs.op_egress_count }}" >> "$GITHUB_ENV"
          echo "PW_OP_MIN_AMOUNT=${{ github.event.inputs.op_min_amount }}" >> "$GITHUB_ENV"
          echo "PW_OP_MAX_AMOUNT=${{ github.event.inputs.op_max_amount }}" >> "$GITHUB_ENV"
          echo "PW_OP_START_STEP=${{ github.event.inputs.op_start_step }}" >> "$GITHUB_ENV"

      - name: Run Playwright suite
        run: ${{ steps.resolve.outputs.command }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.event.inputs.module }}-${{ github.event.inputs.mode }}
          path: playwright-report
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.event.inputs.module }}-${{ github.event.inputs.mode }}
          path: test-results
          if-no-files-found: ignore
